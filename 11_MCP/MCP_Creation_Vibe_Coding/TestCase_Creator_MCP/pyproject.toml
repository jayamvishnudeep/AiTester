[project]
name = "test-creator-mcp"
version = "0.1.0"
description = "MCP server for the VWO test case library: filter by priority and module, the top tests to run, suites, coverage, and new test cases in the house format."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1,<5",
    "pydantic>=2.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0"]

[project.scripts]
tc-mcp = "test_creator_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_creator_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
