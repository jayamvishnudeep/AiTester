[project]
name = "test-skill-finder-mcp"
version = "0.1.0"
description = "MCP server that finds QA and test-automation skills (STLC, Playwright, Selenium, Cypress, API, performance, security, LLM evaluation, AI agents, MCP) by keyword, and serves them as tools, resources and prompts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1,<5",
    "pydantic>=2.12",
    "pyyaml>=6",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0"]

[project.scripts]
tsf-mcp = "test_skill_finder_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_skill_finder_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
