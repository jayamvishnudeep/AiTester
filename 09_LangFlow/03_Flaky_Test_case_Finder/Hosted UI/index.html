<script>
const { useState, useRef, useEffect, useCallback } = React;
const html = htm.bind(React.createElement);

/* ===================================================================
   The comparison. Plain JavaScript, run in this browser - the reports
   never leave the machine. Mirrors the Python component in the repo so
   both give the same answer on the same input.
   =================================================================== */

const OUTCOME = {
  expected:   "passed",
  unexpected: "failed",
  flaky:      "passed on retry",
  skipped:    "skipped",
};

function stripAnsi(s) {
  return String(s).replace(/\u001b\[[0-9;]*[A-Za-z]/g, "");
}

function firstError(test) {
  for (const r of test.results || []) {
    for (const e of r.errors || []) {
      const m = (e && e.message ? String(e.message) : "").trim();
      if (m) return stripAnsi(m).split("\n")[0].trim();
    }
  }
  return "";
}

/* Describe blocks nest, so walk the tree rather than assuming one level. */
function walkSuite(suite, trail, found) {
  const title = (suite.title || "").trim();
  const file  = suite.file || "";
  // the top suite repeats the file name as its title; do not say it twice
  const crumbs = (!title || title === file) ? trail : trail.concat([title]);

  for (const spec of suite.specs || []) {
    const specFile  = spec.file || file;
    const specTitle = spec.title || "";
    for (const test of spec.tests || []) {
      const project = test.projectName || test.projectId || "";
      const id = spec.id || "";
      const key = id
        ? id + "|" + project
        : specFile + "|" + crumbs.concat([specTitle]).join(">") + "|" + project;
      const attempts = (test.results || []).map((r) => r.status || "");
      found.set(key, {
        file: specFile,
        name: crumbs.concat([specTitle]).join(" > "),
        project,
        outcome: OUTCOME[test.status] || test.status || "unknown",
        attempts,
        error: firstError(test),
      });
    }
  }
  for (const child of suite.suites || []) walkSuite(child, crumbs, found);
}

function collect(report) {
  const found = new Map();
  for (const suite of report.suites || []) walkSuite(suite, [], found);
  return found;
}

function compare(reportA, reportB) {
  const a = collect(reportA);
  const b = collect(reportB);
  if (!a.size || !b.size) {
    throw new Error("One of the files contained no tests. Both need to be Playwright JSON reports.");
  }

  const flaky = [], broken = [], stable = [], skipped = [], only = [];
  const keys = Array.from(new Set([...a.keys(), ...b.keys()])).sort();

  for (const key of keys) {
    const x = a.get(key), y = b.get(key);
    if (x && !y) { only.push({ ...x, reason: "ran in run 1 only" }); continue; }
    if (y && !x) { only.push({ ...y, reason: "ran in run 2 only" }); continue; }

    const entry = {
      file: x.file, name: x.name, project: x.project,
      run1: x.outcome, run2: y.outcome,
      run1Attempts: x.attempts, run2Attempts: y.attempts,
      error: x.error || y.error,
    };

    if (x.outcome === "skipped" || y.outcome === "skipped") {
      skipped.push({ ...entry, reason: x.outcome + " in run 1, " + y.outcome + " in run 2" });
    } else if (x.outcome === "passed on retry" || y.outcome === "passed on retry") {
      const which = x.outcome === "passed on retry" ? "run 1" : "run 2";
      flaky.push({ ...entry, reason: "needed a retry in " + which + " — Playwright marked it flaky" });
    } else if (x.outcome !== y.outcome) {
      flaky.push({ ...entry, reason: x.outcome + " in run 1, " + y.outcome + " in run 2" });
    } else if (x.outcome === "failed") {
      broken.push({ ...entry, reason: "failed in both runs" });
    } else {
      stable.push(entry);
    }
  }

  const compared = keys.length;
  return {
    flaky, broken, stable, skipped, only,
    compared,
    flakyCount: flaky.length,
    brokenCount: broken.length,
    stableCount: stable.length,
    rate: compared ? Math.round((1000 * flaky.length) / compared) / 10 : 0,
    run1Stats: summarise(reportA, a),
    run2Stats: summarise(reportB, b),
  };
}

/* Prefer the reporter's own totals; fall back to counting what we walked. */
function summarise(report, found) {
  const s = report.stats || {};
  if (typeof s.expected === "number") {
    return {
      total: (s.expected || 0) + (s.unexpected || 0) + (s.flaky || 0) + (s.skipped || 0),
      passed: s.expected || 0, failed: s.unexpected || 0,
      flaky: s.flaky || 0, skipped: s.skipped || 0,
      startTime: s.startTime || "",
    };
  }
  const out = { total: found.size, passed: 0, failed: 0, flaky: 0, skipped: 0, startTime: "" };
  for (const t of found.values()) {
    if (t.outcome === "passed") out.passed++;
    else if (t.outcome === "failed") out.failed++;
    else if (t.outcome === "passed on retry") out.flaky++;
    else out.skipped++;
  }
  return out;
}

/* ===================================================================
   Sample data, generated here so the page shows something before you
   upload anything. Labelled on screen - it is not anyone's real suite.
   =================================================================== */
function makeSample() {
  const FILES = [
    ["auth/login.spec.ts", "Login", 12], ["auth/signup.spec.ts", "Sign up", 8],
    ["catalog/search.spec.ts", "Search", 14], ["catalog/product.spec.ts", "Product detail", 10],
    ["cart/cart.spec.ts", "Cart", 12], ["checkout/payment.spec.ts", "Payment", 11],
    ["checkout/address.spec.ts", "Delivery address", 7], ["account/profile.spec.ts", "Profile", 9],
    ["account/orders.spec.ts", "Order history", 8], ["media/upload.spec.ts", "Avatar upload", 9],
  ];
  const SPECIAL = {
    "catalog/search.spec.ts:3":  ["shows type-ahead suggestions after three characters", "flakyA"],
    "media/upload.spec.ts:2":    ["shows a preview after the avatar finishes uploading", "flakyB"],
    "checkout/payment.spec.ts:2":["declines an expired card with a field-level error", "broken"],
    "auth/login.spec.ts:10":     ["locks the account after five failed attempts", "broken"],
  };
  const ERRORS = {
    flakyA: "TimeoutError: locator.waitFor: Timeout 5000ms exceeded.\nCall log:\n  - waiting for locator('[data-testid=\"suggestion-list\"] li').first() to be visible",
    flakyB: "TimeoutError: locator.waitFor: Timeout 5000ms exceeded.\nCall log:\n  - waiting for locator('img[data-testid=\"avatar-preview\"]') to be visible",
    broken1: "Error: expect(received).toBe(expected) // Object.is equality\n\nExpected: 5\nReceived: 6",
    broken2: "Error: expect(locator).toHaveText(expected)\n\nExpected string: \"Card expired. Use a different card.\"\nReceived string: \"Something went wrong.\"",
  };

  const build = (run) => {
    const suites = [];
    let expected = 0, unexpected = 0, flakyN = 0;
    for (const [file, describe, count] of FILES) {
      const specs = [];
      for (let i = 1; i <= count; i++) {
        const special = SPECIAL[file + ":" + i];
        const title = special ? special[0] : describe.toLowerCase() + " case " + i;
        const kind = special ? special[1] : "ok";

        let status = "expected", results = [{ status: "passed", errors: [] }];
        if (kind === "broken") {
          status = "unexpected";
          const msg = file.indexOf("login") >= 0 ? ERRORS.broken1 : ERRORS.broken2;
          results = [{ status: "failed", errors: [{ message: msg }] },
                     { status: "failed", errors: [{ message: msg }] }];
        } else if (kind === "flakyA" && run === 1) {
          status = "unexpected";
          results = [{ status: "failed", errors: [{ message: ERRORS.flakyA }] },
                     { status: "failed", errors: [{ message: ERRORS.flakyA }] }];
        } else if (kind === "flakyB" && run === 2) {
          status = "flaky";
          results = [{ status: "failed", errors: [{ message: ERRORS.flakyB }] },
                     { status: "passed", errors: [] }];
        }

        if (status === "expected") expected++;
        else if (status === "unexpected") unexpected++;
        else flakyN++;

        specs.push({
          title, ok: status !== "unexpected", id: file + "#" + i, file,
          tests: [{ projectName: "chromium", status, results }],
        });
      }
      suites.push({ title: file, file, specs: [], suites: [{ title: describe, file, specs }] });
    }
    return {
      suites, errors: [],
      stats: {
        startTime: run === 1 ? "2026-09-12T09:14:03.118Z" : "2026-09-13T09:22:47.402Z",
        expected, unexpected, flaky: flakyN, skipped: 0, duration: 214000,
      },
    };
  };
  return [
    { name: "result1.json (sample)", report: build(1) },
    { name: "result2.json (sample)", report: build(2) },
  ];
}

/* --------------------------------------------------------------- helpers */
function readFile(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("Could not read " + file.name));
    fr.onload = () => {
      try {
        const parsed = JSON.parse(fr.result);
        if (!parsed || !Array.isArray(parsed.suites)) {
          reject(new Error(file.name + " is not a Playwright JSON report — it has no \"suites\"."));
          return;
        }
        resolve({ name: file.name, size: file.size, report: parsed });
      } catch (e) {
        reject(new Error(file.name + " is not valid JSON."));
      }
    };
    fr.readAsText(file);
  });
}

function started(report) {
  const t = report && report.stats && report.stats.startTime;
  const ms = t ? Date.parse(t) : NaN;
  return isNaN(ms) ? null : ms;
}

function shortDate(report) {
  const ms = started(report);
  if (!ms) return "no timestamp";
  return new Date(ms).toLocaleString(undefined,
    { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

/* ------------------------------------------------------------------ icons */
const Logo = () => html`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h3l2.5-7 4 14 2.5-7H21"/></svg>`;
const UploadIcon = () => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/></svg>`;
const FolderIcon = () => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`;
const SwapIcon = () => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 4L4 7M7 4l3 3M17 20V4M17 20l3-3M17 20l-3-3"/></svg>`;
const WarnIcon = () => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>`;
const SunIcon = () => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>`;
const MoonIcon = () => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;

/* ------------------------------------------------------------- components */
function AttemptStrip({ label, attempts }) {
  if (!attempts || !attempts.length) return null;
  return html`
    <div class="att">
      <span class="att-label">${label}</span>
      <div class="squares">
        ${attempts.map((a, i) => {
          const k = a === "passed" ? "p" : (a === "failed" || a === "timedOut") ? "f" : "s";
          return html`<div class=${"sq " + k} key=${i} title=${"attempt " + (i + 1) + ": " + a}>
            ${k === "p" ? "✓" : k === "f" ? "✕" : "–"}</div>`;
        })}
      </div>
    </div>`;
}

function TestCard({ t, kind }) {
  const bits = (t.name || "").split(" > ");
  const name = bits.length ? bits[bits.length - 1] : t.name;
  const suite = bits.length > 1 ? bits.slice(0, -1).join(" > ") : "";
  return html`
    <div class=${"card test " + kind}>
      <div class="test-file">${t.file}</div>
      <div class="test-name">
        ${suite ? html`<span class="test-suite">${suite} › </span>` : null}${name}
      </div>
      <div class="test-reason">${t.reason}</div>
      <div class="attempts">
        <${AttemptStrip} label="Run 1" attempts=${t.run1Attempts} />
        <span class="arrow">→</span>
        <${AttemptStrip} label="Run 2" attempts=${t.run2Attempts} />
      </div>
      ${t.error ? html`<div class="err">${t.error}</div>` : null}
    </div>`;
}

function RunBar({ name, run }) {
  if (!run || !run.total) return null;
  const pct = (n) => (n / run.total) * 100;
  const seg = (n, cls, title) => n > 0
    ? html`<div class=${"seg " + cls} style=${{ width: pct(n) + "%" }} title=${title}>
             ${pct(n) > 7 ? n : ""}</div>`
    : null;
  return html`
    <div class="runrow">
      <div class="runname">${name}</div>
      <div class="bar">
        ${seg(run.passed, "p", run.passed + " passed")}
        ${seg(run.flaky, "k", run.flaky + " passed on retry")}
        ${seg(run.failed, "f", run.failed + " failed")}
      </div>
      <div class="runtot">${run.total} tests</div>
    </div>`;
}

function Results({ comparison, isSample }) {
  const c = comparison;
  const clean = c.flakyCount === 0;
  return html`
    <div>
      ${isSample ? html`<div class="demo-tag"><${FolderIcon} />Sample data — not a real test suite</div>` : null}

      <div class=${"card verdict" + (clean ? " clean" : "")}>
        <div class="big">${c.flakyCount}</div>
        <div class="verdict-copy">
          <h2>${clean ? "No flaky tests found"
                      : c.flakyCount === 1 ? "1 flaky test" : c.flakyCount + " flaky tests"}</h2>
          <p>
            ${clean
              ? html`Both runs agreed on all ${c.compared} tests. Nothing needs quarantining.`
              : html`Out of ${c.compared} tests compared, ${c.flakyCount} did not agree with
                     themselves across the two runs.`}
            ${c.brokenCount > 0
              ? html` ${c.brokenCount} other ${c.brokenCount === 1 ? "test" : "tests"} failed in both
                      runs — ${c.brokenCount === 1 ? "that is a defect" : "those are defects"}, not flake.`
              : null}
          </p>
        </div>
      </div>

      <div class="tiles">
        <div class="card tile a"><div class="n">${c.compared}</div><div class="k">Compared</div></div>
        <div class="card tile f"><div class="n">${c.flakyCount}</div><div class="k">Flaky</div></div>
        <div class="card tile b"><div class="n">${c.brokenCount}</div><div class="k">Broken</div></div>
        <div class="card tile s"><div class="n">${c.stableCount}</div><div class="k">Stable</div></div>
        <div class="card tile a"><div class="n">${c.rate}%</div><div class="k">Flake rate</div></div>
      </div>

      <div class="card runs">
        <h3>Run composition</h3>
        <${RunBar} name="Run 1" run=${c.run1Stats} />
        <${RunBar} name="Run 2" run=${c.run2Stats} />
        <div class="legend">
          <span><i class="chip" style=${{ background: "var(--stable)" }}></i> passed</span>
          <span><i class="chip" style=${{ background: "var(--flaky)" }}></i> passed on retry</span>
          <span><i class="chip" style=${{ background: "var(--broken)" }}></i> failed</span>
        </div>
      </div>

      ${c.only.length ? html`
        <div class="notice warn">
          <${WarnIcon} />
          <div><b>${c.only.length} ${c.only.length === 1 ? "test" : "tests"} ran in only one of the
          two files.</b><br />They are left out of the comparison — flakiness needs a test to appear
          in both runs.</div>
        </div>` : null}

      ${c.flaky.length ? html`
        <div class="group">
          <div class="group-head"><h2>Flaky tests</h2><span class="count f">${c.flaky.length}</span></div>
          <p class="group-note">These disagreed with themselves. Quarantine them before trusting the suite.</p>
          ${c.flaky.map((t, i) => html`<${TestCard} t=${t} kind="f" key=${i} />`)}
        </div>` : null}

      ${c.broken.length ? html`
        <div class="group">
          <div class="group-head"><h2>Not flaky — actually broken</h2><span class="count b">${c.broken.length}</span></div>
          <p class="group-note">Failed in both runs. Re-running these will not help; they need fixing.</p>
          ${c.broken.map((t, i) => html`<${TestCard} t=${t} kind="b" key=${i} />`)}
        </div>` : null}

    </div>`;
}

/* -------------------------------------------------------------------- app */
function App() {
  const [files, setFiles] = useState(null);      // [{name, report}, {name, report}]
  const [isSample, setIsSample] = useState(false);
  const [comparison, setComparison] = useState(null);
  const [error, setError] = useState(null);
  const [over, setOver] = useState(false);
  const [theme, setTheme] = useState("auto");
  const input = useRef(null);

  useEffect(() => {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  const apply = useCallback((pair, sample) => {
    // the run that started earlier is Run 1; fall back to the order given
    const ordered = pair.slice();
    const t0 = started(ordered[0].report), t1 = started(ordered[1].report);
    if (t0 && t1 && t1 < t0) ordered.reverse();
    try {
      setComparison(compare(ordered[0].report, ordered[1].report));
      setFiles(ordered);
      setIsSample(!!sample);
      setError(null);
    } catch (e) {
      setError(e.message);
      setComparison(null);
    }
  }, []);

  const take = useCallback(async (list) => {
    const chosen = Array.from(list || []);
    if (chosen.length !== 2) {
      setError("Select exactly two files — one JSON report from each run. You chose "
               + chosen.length + ".");
      return;
    }
    try {
      apply(await Promise.all(chosen.map(readFile)), false);
    } catch (e) {
      setError(e.message);
      setComparison(null);
    }
  }, [apply]);

  const swap = useCallback(() => {
    if (!files) return;
    const flipped = [files[1], files[0]];
    setFiles(flipped);
    try { setComparison(compare(flipped[0].report, flipped[1].report)); }
    catch (e) { setError(e.message); }
  }, [files]);

  const dark = theme === "dark" || (theme === "auto" && window.matchMedia
    && window.matchMedia("(prefers-color-scheme: dark)").matches);

  return html`
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <div class="glyph"><${Logo} /></div>
          <div>
            <h1>Flaky Test Finder</h1>
            <div class="tagline">Compare two Playwright runs and see which tests disagree with themselves.</div>
          </div>
        </div>
        <button class="icon-btn" onClick=${() => setTheme(dark ? "light" : "dark")}
                title=${dark ? "Switch to light" : "Switch to dark"}
                aria-label=${dark ? "Switch to light theme" : "Switch to dark theme"}>
          ${dark ? html`<${SunIcon} />` : html`<${MoonIcon} />`}
        </button>
      </header>

      <input ref=${input} type="file" multiple accept=".json,application/json"
             style=${{ display: "none" }}
             onChange=${(e) => { take(e.target.files); e.target.value = ""; }} />

      ${!comparison ? html`
        <div class=${"drop" + (over ? " over" : "")} role="button" tabIndex=${0}
             onClick=${() => input.current && input.current.click()}
             onKeyDown=${(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.current.click(); } }}
             onDragOver=${(e) => { e.preventDefault(); setOver(true); }}
             onDragLeave=${() => setOver(false)}
             onDrop=${(e) => { e.preventDefault(); setOver(false); take(e.dataTransfer.files); }}>
          <${UploadIcon} />
          <h2>Choose two Playwright reports</h2>
          <p>The two JSON files from two runs of the same suite. They stay on your machine.</p>
          <span class="pick"><${FolderIcon} />Upload files</span>
          <div class="or">or drag them here</div>
          <div class="matrix">
            <span class="h">Run 1</span><span class="h">Run 2</span><span class="h">Verdict</span>
            <span class="m">failed</span><span class="m">passed</span><span class="v f">Flaky</span>
            <span class="m">passed</span><span class="m">failed</span><span class="v f">Flaky</span>
            <span class="m">failed</span><span class="m">failed</span><span class="v b">Broken</span>
            <span class="m">passed</span><span class="m">passed</span><span class="v s">Healthy</span>
          </div>
        </div>
        <div class="bar-actions" style=${{ justifyContent: "center" }}>
          <button class="ghost" onClick=${() => apply(makeSample(), true)}>
            Try it with sample data
          </button>
        </div>` : null}

      ${error ? html`
        <div class="notice"><${WarnIcon} /><div><b>That did not work</b><br />${error}</div></div>` : null}

      ${comparison && files ? html`
        <div>
          <div class="slots">
            <div class="card slot">
              <div class="rl">Run 1</div>
              <div class="fn">${files[0].name}</div>
              <div class="fm">${shortDate(files[0].report)} · ${files[0].report.stats
                ? (files[0].report.stats.expected || 0) + (files[0].report.stats.unexpected || 0)
                  + (files[0].report.stats.flaky || 0) + (files[0].report.stats.skipped || 0)
                : comparison.run1Stats.total} tests</div>
            </div>
            <button class="swap" onClick=${swap} title="Swap which run is first"
                    aria-label="Swap which run is first"><${SwapIcon} /></button>
            <div class="card slot">
              <div class="rl">Run 2</div>
              <div class="fn">${files[1].name}</div>
              <div class="fm">${shortDate(files[1].report)} · ${comparison.run2Stats.total} tests</div>
            </div>
          </div>
          <div class="bar-actions">
            <button class="ghost" onClick=${() => input.current && input.current.click()}>
              Choose different files
            </button>
            <button class="ghost" onClick=${() => { setComparison(null); setFiles(null); setError(null); }}>
              Start over
            </button>
          </div>
          <${Results} comparison=${comparison} isSample=${isSample} />
        </div>` : null}

      <footer>
        Your reports are read in this browser and never uploaded anywhere.<br />
        Everything is computed on this page.
      </footer>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
