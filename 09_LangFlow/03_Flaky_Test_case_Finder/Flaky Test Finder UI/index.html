<script>
const { useState, useEffect, useCallback, useRef } = React;
const html = htm.bind(React.createElement);

/* Change these and the Connection panel can stay closed. Leave apiKey blank -
   keys belong in the browser, not in a file that might be committed. */
const DEFAULTS = {
  baseUrl: "http://127.0.0.1:7860",
  flowId:  "90a3ee19-9e17-42ac-82ef-073d6120b4fc",
  apiKey:  "",
  folder:  "e:/Visual Studio Code/AiTester/09_LangFlow/03_Flaky_Test_case_Finder/results",
};

const CMP_NODE   = "FlakyTestComparator";   // component_id prefix in the response
const HISTORY_CAP = 25;

/* ------------------------------------------------------------- storage */
function load(key, fallback) {
  try { const v = localStorage.getItem("flaky." + key); return v === null ? fallback : v; }
  catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem("flaky." + key, value); } catch { /* private mode */ }
}
function loadHistory() {
  try {
    const raw = localStorage.getItem("flaky.history");
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch { return []; }
}
function saveHistory(runs) {
  try { localStorage.setItem("flaky.history", JSON.stringify(runs.slice(-HISTORY_CAP))); }
  catch { /* over quota - the run still shows on screen */ }
}

/* --------------------------------------------------------------- parsing
   The comparator writes a fixed shape, so this reads it rather than guessing.
   Every number on screen comes from here, never from the model's prose. */
function parseComparison(raw) {
  if (!raw) return null;

  const runLine = (n) => {
    const m = raw.match(new RegExp("^Run " + n + ": (\\d+) tests? - (.+)$", "m"));
    if (!m) return null;
    const out = { total: Number(m[1]), passed: 0, failed: 0, flaky: 0, skipped: 0 };
    m[2].split(",").forEach((part) => {
      const mm = part.trim().match(/^(\d+)\s+(\w+)$/);
      if (mm && mm[2] in out) out[mm[2]] = Number(mm[1]);
    });
    return out;
  };

  const num = (label) => {
    const m = raw.match(new RegExp("^" + label + ":\\s*([\\d.]+)", "m"));
    return m ? Number(m[1]) : 0;
  };

  /* Split on the headings rather than matching across them - an anchored "$"
     under the m flag would stop at the first line break, not the next heading. */
  const section = (heading) => {
    const chunk = raw.split(/\n## /).find((c) => c.startsWith(heading + " ("));
    if (!chunk) return [];
    const body = chunk.slice(chunk.indexOf("\n") + 1);
    return body.split(/\n(?=\d+\.\s)/).map((chunk) => {
      const lines = chunk.split("\n").map((l) => l.trim()).filter(Boolean);
      const head = lines.find((l) => /^\d+\.\s/.test(l));
      if (!head) return null;                       // the note line above the list

      const title = head.replace(/^\d+\.\s*/, "");
      const bits  = title.split(" > ");
      const field = (prefix) => {
        const line = lines.find((l) => l.startsWith("- " + prefix));
        return line ? line.slice(prefix.length + 2).trim() : "";
      };

      const att = field("attempts:").match(/run 1 \[([^\]]*)\]\s*\/\s*run 2 \[([^\]]*)\]/);
      const split = (s) => (s || "").split(",").map((x) => x.trim()).filter(Boolean);

      // the reason is the one bullet that is neither the attempts nor the error
      const reason = lines
        .filter((l) => l.startsWith("- ") && !/^- (attempts:|error:)/.test(l))
        .map((l) => l.slice(2).trim())[0] || "";

      return {
        file:   bits[0] || title,
        suite:  bits.length > 2 ? bits.slice(1, -1).join(" > ") : "",
        name:   bits.length > 1 ? bits[bits.length - 1] : "",
        reason,
        run1:   att ? split(att[1]) : [],
        run2:   att ? split(att[2]) : [],
        error:  field("error:"),
      };
    }).filter(Boolean);
  };

  const flaky  = section("Flaky tests");
  const broken = section("Consistently failing");

  return {
    run1: runLine(1),
    run2: runLine(2),
    compared: num("Tests compared"),
    flakyCount:  num("FLAKY"),
    brokenCount: num("CONSISTENTLY FAILING"),
    stableCount: num("STABLE"),
    rate: (raw.match(/^Flake rate:\s*([\d.]+)%/m) || [])[1] || "0",
    flaky,
    broken,
  };
}

function when(ts) {
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return new Date(ts).toLocaleDateString();
}

/* ------------------------------------------------------------ components */
function AttemptStrip({ label, attempts }) {
  if (!attempts || !attempts.length) return null;
  return html`
    <div class="att">
      <span class="att-label">${label}</span>
      <div class="squares">
        ${attempts.map((a, i) => {
          const k = a === "passed" ? "p" : a === "failed" || a === "timedOut" ? "f" : "s";
          return html`<div class=${"sq " + k} key=${i} title=${"attempt " + (i + 1) + ": " + a}>
                        ${k === "p" ? "\u2713" : k === "f" ? "\u2715" : "\u2013"}
                      </div>`;
        })}
      </div>
    </div>`;
}

function TestCard({ t, kind }) {
  return html`
    <div class=${"card test " + kind}>
      <div class="test-file">${t.file}</div>
      <div class="test-name">
        ${t.suite ? html`<span class="test-suite">${t.suite} › </span>` : null}${t.name}
      </div>
      ${t.reason ? html`<div class="test-reason">${t.reason}</div>` : null}
      <div class="attempts">
        <${AttemptStrip} label="Run 1" attempts=${t.run1} />
        <span class="arrow">→</span>
        <${AttemptStrip} label="Run 2" attempts=${t.run2} />
      </div>
      ${t.error ? html`<div class="err">${t.error}</div>` : null}
    </div>`;
}

function RunBar({ name, run }) {
  if (!run || !run.total) return null;
  const pct = (n) => (n / run.total) * 100;
  const seg = (n, cls, title) =>
    n > 0 ? html`<div class=${"seg " + cls} style=${{ width: pct(n) + "%" }} title=${title}>
                   ${pct(n) > 7 ? n : ""}
                 </div>` : null;
  return html`
    <div class="runrow">
      <div class="runname">${name}</div>
      <div class="bar">
        ${seg(run.passed, "p", run.passed + " passed")}
        ${seg(run.flaky,  "k", run.flaky + " passed on retry")}
        ${seg(run.failed, "f", run.failed + " failed")}
      </div>
      <div class="runtot">${run.total} tests</div>
    </div>`;
}

function Results({ r }) {
  const c = r.comparison;
  if (!c) return null;
  const clean = c.flakyCount === 0;

  return html`
    <div>
      <div class=${"card verdict" + (clean ? " clean" : "")}>
        <div class="big">${c.flakyCount}</div>
        <div class="verdict-copy">
          <h2>${clean ? "No flaky tests found"
                      : c.flakyCount === 1 ? "1 flaky test" : c.flakyCount + " flaky tests"}</h2>
          <p>
            ${clean
              ? html`Both runs agreed on all ${c.compared} tests. Nothing needs quarantining.`
              : html`Out of ${c.compared} tests compared, ${c.flakyCount} did not agree with
                     themselves across the two runs.`}
            ${c.brokenCount > 0
              ? html` ${c.brokenCount} other ${c.brokenCount === 1 ? "test" : "tests"} failed in
                      both runs — ${c.brokenCount === 1 ? "that is a defect" : "those are defects"},
                      not flake.`
              : null}
          </p>
        </div>
      </div>

      <div class="tiles">
        <div class="card tile a"><div class="n">${c.compared}</div><div class="k">Compared</div></div>
        <div class="card tile f"><div class="n">${c.flakyCount}</div><div class="k">Flaky</div></div>
        <div class="card tile b"><div class="n">${c.brokenCount}</div><div class="k">Broken</div></div>
        <div class="card tile s"><div class="n">${c.stableCount}</div><div class="k">Stable</div></div>
        <div class="card tile a"><div class="n">${c.rate}%</div><div class="k">Flake rate</div></div>
      </div>

      ${c.run1 && c.run2 ? html`
        <div class="card runs">
          <h3>Run composition</h3>
          <${RunBar} name="Run 1" run=${c.run1} />
          <${RunBar} name="Run 2" run=${c.run2} />
          <div class="legend">
            <span><i class="chip" style=${{ background: "var(--stable)" }}></i> passed</span>
            <span><i class="chip" style=${{ background: "var(--flaky)" }}></i> passed on retry</span>
            <span><i class="chip" style=${{ background: "var(--broken)" }}></i> failed</span>
          </div>
        </div>` : null}

      ${c.flaky.length ? html`
        <div class="group">
          <div class="group-head">
            <h2>Flaky tests</h2><span class="count f">${c.flaky.length}</span>
          </div>
          <p class="group-note">These disagreed with themselves. Quarantine them before trusting the suite.</p>
          ${c.flaky.map((t, i) => html`<${TestCard} t=${t} kind="f" key=${i} />`)}
        </div>` : null}

      ${c.broken.length ? html`
        <div class="group">
          <div class="group-head">
            <h2>Not flaky — actually broken</h2><span class="count b">${c.broken.length}</span>
          </div>
          <p class="group-note">Failed in both runs. Re-running these will not help; they need fixing.</p>
          ${c.broken.map((t, i) => html`<${TestCard} t=${t} kind="b" key=${i} />`)}
        </div>` : null}

      ${r.prose ? html`
        <div class="card summary">
          <div class="summary-head">
            <h2>What the agent recommends</h2>
            <div class="meta">
              ${r.model ? html`<span>${r.model}</span>` : null}
              ${r.tokens ? html`<span>${r.tokens} tokens</span>` : null}
              <span>${(r.seconds || 0).toFixed(1)}s</span>
            </div>
          </div>
          <div class="prose" dangerouslySetInnerHTML=${{ __html: marked.parse(r.prose) }}></div>
        </div>` : null}
    </div>`;
}

function History({ runs, onPick, onClear }) {
  if (!runs.length) return null;
  const newest = runs.slice().reverse();
  return html`
    <details class="history">
      <summary>History<span class="hcount">${runs.length} ${runs.length === 1 ? "run" : "runs"}</span></summary>
      <div class="hlist">
        ${newest.map((r) => {
          const n = r.comparison ? r.comparison.flakyCount : 0;
          return html`
            <button class="hrow" key=${r.ts} onClick=${() => onPick(r)}>
              <span class=${"hbadge " + (n ? "f" : "s")}>${n}</span>
              <span class="hmain">
                <span class="t">${n === 1 ? "1 flaky test" : n + " flaky tests"}${
                  r.comparison ? " of " + r.comparison.compared : ""}</span>
                <span class="s">${r.folder || "default folder"}</span>
              </span>
              <span class="hwhen">${when(r.ts)}</span>
            </button>`;
        })}
      </div>
      <button class="clear" onClick=${onClear}>Clear history</button>
    </details>`;
}

/* -------------------------------------------------------------------- app */
function App() {
  const [baseUrl, setBaseUrl] = useState(() => load("baseUrl", DEFAULTS.baseUrl));
  const [flowId,  setFlowId]  = useState(() => load("flowId",  DEFAULTS.flowId));
  const [apiKey,  setApiKey]  = useState(() => load("apiKey",  DEFAULTS.apiKey));
  const [folder,  setFolder]  = useState(() => load("folder",  DEFAULTS.folder));
  const [theme,   setTheme]   = useState(() => load("theme", "auto"));

  const [runs,   setRuns]   = useState(loadHistory);
  const [shown,  setShown]  = useState(() => { const h = loadHistory(); return h.length ? h[h.length - 1] : null; });
  const [busy,   setBusy]   = useState(false);
  const [error,  setError]  = useState(null);
  const [health, setHealth] = useState("unknown");
  const resultRef = useRef(null);

  useEffect(() => { save("baseUrl", baseUrl); }, [baseUrl]);
  useEffect(() => { save("flowId",  flowId);  }, [flowId]);
  useEffect(() => { save("apiKey",  apiKey);  }, [apiKey]);
  useEffect(() => { save("folder",  folder);  }, [folder]);

  useEffect(() => {
    save("theme", theme);
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  /* is Langflow actually up? */
  useEffect(() => {
    let alive = true;
    setHealth("checking");
    fetch(baseUrl.replace(/\/+$/, "") + "/health_check")
      .then((r) => { if (alive) setHealth(r.ok ? "up" : "down"); })
      .catch(() => { if (alive) setHealth("down"); });
    return () => { alive = false; };
  }, [baseUrl]);

  const run = useCallback(async () => {
    if (busy) return;
    if (!apiKey.trim()) {
      setError({ title: "No Langflow API key",
                 body: "Open Connection below and paste a key from Langflow → Settings → API Keys." });
      return;
    }
    setBusy(true);
    setError(null);
    const started = Date.now();

    try {
      const res = await fetch(
        baseUrl.replace(/\/+$/, "") + "/api/v1/run/" + flowId.trim() + "?stream=false",
        {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-api-key": apiKey.trim() },
          /* debug so the response carries the comparator's own report, which is
             where every number on screen comes from */
          body: JSON.stringify({
            output_type: "debug",
            input_type: "chat",
            input_value: folder.trim() || "run",
          }),
        }
      );

      const text = await res.text();
      let data = null;
      try { data = JSON.parse(text); } catch { /* not JSON */ }

      if (!res.ok) {
        const detail = data && data.detail
          ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail))
          : text.slice(0, 300);
        throw new Error("HTTP " + res.status + " — " + detail);
      }

      const blocks = (data && data.outputs && data.outputs[0] && data.outputs[0].outputs) || [];
      const cmp  = blocks.find((b) => (b.component_id || "").startsWith(CMP_NODE));
      const chat = blocks.find((b) => (b.component_id || "").startsWith("ChatOutput"));
      const llm  = blocks.find((b) => b.token_usage);

      const rawReport =
        (cmp && cmp.artifacts && cmp.artifacts.report && cmp.artifacts.report.raw) ||
        (cmp && cmp.outputs && cmp.outputs.report && cmp.outputs.report.message) || "";

      const comparison = parseComparison(rawReport);
      if (!comparison) {
        throw new Error("The flow ran but returned no comparison. Check that the flow "
                      + "contains the Flaky Test Comparator node.");
      }

      const msg = chat && chat.results && chat.results.message;
      const usage = llm && llm.token_usage;

      const entry = {
        ts: Date.now(),
        folder: folder.trim(),
        comparison,
        prose: (msg && msg.text) || "",
        model: (msg && msg.properties && msg.properties.source && msg.properties.source.source) || "",
        tokens: usage ? (usage.total_tokens || usage.completion_tokens || 0) : 0,
        seconds: (Date.now() - started) / 1000,
      };

      const next = [...runs, entry].slice(-HISTORY_CAP);
      setRuns(next);
      saveHistory(next);
      setShown(entry);
      requestAnimationFrame(() => {
        if (resultRef.current) resultRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    } catch (e) {
      const offline = /Failed to fetch|NetworkError/i.test(e.message);
      setError({
        title: offline ? "Could not reach Langflow" : "The run did not finish",
        body: offline
          ? "Is Langflow running at " + baseUrl + "? Start it, then try again."
          : e.message,
      });
    } finally {
      setBusy(false);
    }
  }, [busy, apiKey, baseUrl, flowId, folder, runs]);

  const dark = theme === "dark" ||
    (theme === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);

  return html`
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <div class="glyph"><${Logo} /></div>
          <div>
            <h1>Flaky Test Finder</h1>
            <div class="tagline">Compare two Playwright runs and see which tests disagree with themselves.</div>
          </div>
        </div>
        <div class="top-right">
          <span class="pill">
            <span class=${"dot " + (health === "up" ? "ok" : health === "checking" ? "wait" : "bad")}></span>
            ${health === "up" ? "Langflow connected"
              : health === "checking" ? "Checking…" : "Langflow unreachable"}
          </span>
          <button class="icon-btn" onClick=${() => setTheme(dark ? "light" : "dark")}
                  title=${dark ? "Switch to light" : "Switch to dark"}
                  aria-label=${dark ? "Switch to light theme" : "Switch to dark theme"}>
            ${dark ? html`<${SunIcon} />` : html`<${MoonIcon} />`}
          </button>
        </div>
      </header>

      <div class="card console">
        <div class="console-row">
          <div class="field">
            <label class="label" for="folder">Results folder</label>
            <input id="folder" type="text" value=${folder} spellcheck="false"
                   placeholder="Folder holding result1.json and result2.json"
                   onChange=${(e) => setFolder(e.target.value)}
                   onKeyDown=${(e) => { if (e.key === "Enter") run(); }} />
          </div>
          <button class="run" onClick=${run} disabled=${busy}>
            ${busy ? html`<span class="spin"></span>Comparing…`
                   : html`<${PlayIcon} />Compare runs`}
          </button>
        </div>
        <div class="hint">
          ${"The folder needs two Playwright reports named "}
          <code class="mono">result1.json</code>${" and "}<code class="mono">result2.json</code>${"."}
          ${" Leave it blank to use the flow's default."}
        </div>

        <details class="settings">
          <summary>Connection</summary>
          <div class="settings-grid">
            <div class="field">
              <label class="label" for="url">Base URL</label>
              <input id="url" type="text" value=${baseUrl} spellcheck="false"
                     onChange=${(e) => setBaseUrl(e.target.value)} />
            </div>
            <div class="field">
              <label class="label" for="fid">Flow ID</label>
              <input id="fid" type="text" value=${flowId} spellcheck="false"
                     onChange=${(e) => setFlowId(e.target.value)} />
            </div>
            <div class="field">
              <label class="label" for="key">Langflow API key</label>
              <input id="key" type="password" value=${apiKey} placeholder="sk-…"
                     onChange=${(e) => setApiKey(e.target.value)} />
            </div>
          </div>
          <div class="hint">Saved in this browser only. Nothing is sent anywhere except your own Langflow.</div>
        </details>
      </div>

      ${error ? html`
        <div class="notice">
          <${WarnIcon} />
          <div><b>${error.title}</b><br />${error.body}</div>
        </div>` : null}

      <div ref=${resultRef}>
        ${shown ? html`<${Results} r=${shown} />` : html`
          <div class="card empty">
            <${EmptyIcon} />
            <h2>Nothing compared yet</h2>
            <p>Point this at a folder holding two Playwright JSON reports from the same suite,
               then press Compare runs.</p>
            <div class="matrix">
              <span class="h">Run 1</span><span class="h">Run 2</span><span class="h">Verdict</span>
              <span class="m">failed</span><span class="m">passed</span><span class="v f">Flaky</span>
              <span class="m">passed</span><span class="m">failed</span><span class="v f">Flaky</span>
              <span class="m">failed</span><span class="m">failed</span><span class="v b">Broken</span>
              <span class="m">passed</span><span class="m">passed</span><span class="v s">Healthy</span>
            </div>
          </div>`}
      </div>

      <${History} runs=${runs} onPick=${setShown}
                  onClear=${() => { setRuns([]); saveHistory([]); }} />

      <footer>Runs against your local Langflow flow. Counts come from the comparator, not the model.</footer>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
